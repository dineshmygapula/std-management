<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'employee/css/style.css'%}">
</head>
<body>
      <h1>Employee Management system</h1>
      <h2>{{title}}</h2>
      {% for comp in company_details %}
           <h3>{{comp.name}}</h3>
           <h3>{{comp.location}}</h3>
           <h3>{{comp.description}}</h3>
      {% endfor %}
        <img src="{% static 'employee/images/logo.png' %}" alt="logo">
        <button onclick="showMessages()">Click Me</button>
      <script src="{% static 'employee/js/script.js' %}"></script>
</body>
</html>
